name: Framework Explainer Pipeline

on:
  workflow_dispatch:
  push: # input/term.md 저장(커밋) 시 즉시 생성+배포(후킹), 사이트 파일 변경 시 배포
    branches: [main]
    paths:
      - "input/**"
      - "content/**"
      - "hugo.toml"
      - "archetypes/**"
      - "assets/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: framework-pipeline
  cancel-in-progress: false

jobs:
  generate:
    # push 이벤트에서도 실행 — input/term.md 저장이 곧 후킹 트리거 (크론 없음, 후킹 전용).
    # 이미 게시된 용어는 해시 dedup으로 즉시 스킵되므로 중복 실행 비용 없음.
    runs-on: ubuntu-latest
    # concurrency 그룹을 쓰므로 잡 하나가 매달리면 이후 실행이 전부 막힌다
    # (실제로 큐에 54시간 갇힌 적 있음). GitHub 기본 360분 대신 상한을 둔다.
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate framework post
        id: generate
        continue-on-error: true
        env:
          # CLAUDE_CODE_OAUTH_TOKEN 등록 시 구독 인증(claude-code), 없으면 API 키 과금(api)
          JUDGE_BACKEND: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'claude-code' || 'api' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/generate.py

      - name: Commit new post
        id: commit
        run: |
          git config user.name "framework-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/posts pipeline/state.json input/term.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "신규 포스트 없음 — 커밋 스킵"
          else
            git commit -m "chore: new framework post $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Surface generation failure
        if: steps.generate.outcome == 'failure'
        run: |
          echo "::error::생성 단계 실패 — 위 'Generate framework post' 로그의 마지막 줄을 확인하세요."
          echo "::error::흔한 원인 ①타임아웃(CLI_TIMEOUT_SEC 상향) ②용어 상한 초과(MAX_TERMS_PER_RUN) ③인증/크레딧"
          exit 1

  deploy:
    needs: generate
    # 수동·push 이벤트에서는 신규 포스트 유무와 무관하게 항상 배포 (사이트 파일 변경도 반영)
    if: ${{ !cancelled() && (needs.generate.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          ref: main
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 10분(600000ms)이 액션이 허용하는 최대값이자 기본값이다 — 더 크게 주면
          # 경고와 함께 조용히 잘린다. Pages 장애로 deployment_in_progress가
          # 10분을 넘기면 이 잡은 실패로 뜨지만 배포 자체는 뒤늦게 반영되므로,
          # 그 경우엔 재실행보다 Pages 상태(githubstatus.com)를 먼저 확인할 것.
          timeout: 600000 # 10분 (최대값)
          error_count: 20 # 일시적 상태조회 오류에 좀 더 관대하게 (기본 10)
